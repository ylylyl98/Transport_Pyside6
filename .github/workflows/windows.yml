name: Windows tests and EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transport-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_BACKEND: software

jobs:
  tests:
    name: Offline tests (${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned runtime dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Run every module in a separate hardware-blocked process
        run: >-
          .venv\Scripts\python.exe -B tools/verify_quick_release.py --jobs 1
          --shard-index ${{ matrix.shard }} --shard-count 4
          --output tmp/ci-tests/shard-${{ matrix.shard }}
      - name: Retain test evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-tests-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tmp/ci-tests/
            tmp/verification/reports/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build and exercise Windows packages
    needs: tests
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install pinned runtime and build dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build shared onedir bundle and checksum
        run: .venv\Scripts\python.exe -B tools/build_windows.py
      - name: Verify the frozen bundle outside the checkout
        run: .venv\Scripts\python.exe -B tools/verify_frozen.py --bundle dist/Transport --output tmp/frozen-smoke
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: ./tools/Install-InnoSetup.ps1
      - name: Build per-user installer and both release checksums
        run: .venv\Scripts\python.exe -B tools/build_installer.py --bundle dist/Transport --output dist
      - name: Verify install, upgrade, process protection, and uninstall
        run: .venv\Scripts\python.exe -B tools/verify_installer.py --installer dist/Transport-Setup-windows-x64.exe --output tmp/installer-smoke
      - name: Retain package diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            tmp/frozen-smoke/
            tmp/installer-smoke/
            tmp/inno-download/install.log
            tmp/pyinstaller-isolated/**/warn-*.txt
            dist/Transport/build-info.json
            dist/Transport-Setup-windows-x64.manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified Windows installer and portable package
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Transport-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/Transport-windows-x64.zip
            dist/Transport-Setup-windows-x64.exe
            dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish version tag to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [tests, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag still identifies the tested main commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" refs/remotes/origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: release-assets
      - name: Check release artifact integrity
        working-directory: release-assets
        run: |
          set -euo pipefail
          test -s Transport-windows-x64.zip
          test -s Transport-Setup-windows-x64.exe
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          grep -Eq '^[0-9a-f]{64}  Transport-windows-x64\.zip$' SHA256SUMS.txt
          grep -Eq '^[0-9a-f]{64}  Transport-Setup-windows-x64\.exe$' SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release assets for this tested tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A re-run must not silently overwrite a previously published binary.
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "Transport $RELEASE_TAG" \
            release-assets/Transport-Setup-windows-x64.exe \
            release-assets/Transport-windows-x64.zip release-assets/SHA256SUMS.txt
